name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Rebuild curricula/index.json from every .json file in the curricula folder
      # so the site lists a curriculum as soon as its file is pushed.
      - name: Build curriculum index
        run: |
          cd curricula
          ls -1 *.json | grep -v '^index.json$' | jq -R . | jq -s . > index.json
          cat index.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
