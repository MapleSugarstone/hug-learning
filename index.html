  <meta name="twitter:card" content="summary_large_image">

<body>

      <button type="button" class="btn btn-ghost" id="home-btn" hidden>Home</button>

  <main id="app">
    <noscript>

        <h1>JavaScript is required</h1>
        <p>This learning tool runs entirely in your browser and needs JavaScript turned on.</p>
      </div>
    </noscript>
